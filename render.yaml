services:
  - type: web
    name: citadel-budget
    runtime: static
    buildCommand: mkdir -p dist && cp index.html styles.css bills.css schedule.css mobile-premium.css native-app.css distribution-mobile.css one-page-mobile.css app.js dist/
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
