services:
  - type: web
    name: stock-analyst
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 stock_analyst.py --serve --host 0.0.0.0"
    healthCheckPath: /healthz
    envVars:
      - key: STOCK_ANALYST_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: STOCK_ANALYST_PUBLIC_URL
        sync: false
      - key: STOCK_ANALYST_AUTO_SCAN_MINUTES
        value: "30"
      - key: STOCK_ANALYST_ALERT_ENTRY_MODE
        value: confirmed
